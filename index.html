<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANI - Pro FF Optimization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-purple: #b026ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --terminal-green: #00ff2a;
            --card-bg: rgba(10, 5, 20, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 38, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Futuristic Cyberpunk RGB Border Animation */
        @keyframes cyberpunk-rgb {
            0% { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; } 
            25% { border-color: #bc13fe; box-shadow: 0 0 15px #bc13fe; } 
            50% { border-color: #ff007f; box-shadow: 0 0 15px #ff007f; } 
            75% { border-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; } 
            100% { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; } 
        }

        header {
            position: absolute;
            top: 25px;
            text-align: center;
            width: 100%;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            letter-spacing: 8px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--neon-cyan); }
            100% { text-shadow: 0 0 25px var(--neon-cyan), 0 0 15px var(--neon-purple); -webkit-text-stroke: 2px var(--neon-purple); }
        }

        .container {
            width: 95%;
            max-width: 600px;
            background: var(--card-bg);
            border: 2px solid #00f3ff;
            padding: 35px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            margin-top: 80px;
            animation: cyberpunk-rgb 6s linear infinite;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00f3ff;
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
            animation: cyberpunk-rgb 5s linear infinite reverse;
        }

        input:focus, select:focus {
            background: rgba(20, 20, 30, 0.9);
        }

        .btn {
            background: rgba(0, 0, 0, 0.6);
            color: var(--text-main);
            border: 2px solid #bc13fe;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: cyberpunk-rgb 4s linear infinite;
            width: 100%;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .error-msg {
            color: #ff0055;
            font-size: 1rem;
            text-align: center;
            display: none;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0055;
            margin-top: -5px;
        }

        .dash-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .dash-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00f3ff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: cyberpunk-rgb 7s linear infinite alternate;
        }

        .dash-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.05);
        }

        .dash-card h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        
        .dash-card p {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .terminal {
            background: #020205;
            border: 2px solid #00f3ff;
            padding: 15px;
            height: 220px;
            overflow-y: auto;
            color: var(--terminal-green);
            font-size: 0.95rem;
            border-radius: 6px;
            text-align: left;
            animation: cyberpunk-rgb 5s linear infinite;
        }

        .terminal p { margin: 6px 0; text-shadow: 0 0 5px var(--terminal-green); }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00f3ff;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            animation: cyberpunk-rgb 6s linear infinite reverse;
        }

        .stat-label { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: var(--text-main); margin-top: 5px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);}

        .info-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #bc13fe;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
            animation: cyberpunk-rgb 7s linear infinite;
        }
        .info-box h3 {
            color: var(--text-main);
            font-size: 1.1rem;
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(188, 19, 254, 0.6);
        }
        .info-box p {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .info-box span {
            color: var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
